# =====================================================================
# Render.com Blueprint Deployment Specification
# HOMES2OWN — Full-Stack Mumbai Real Estate Consultancy Platform
# Deploys unified Backend REST API & compiled Vite Single Page Application
# =====================================================================

services:
  - type: web
    name: homes2own-platform
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: bash render-build.sh
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_CLIENT
        value: sqlite
      - key: APP_DOMAIN
        value: homes2own.com
      - key: WHATSAPP_PHONE
        value: "919820155443"
      - key: CONSULTANT_EMAIL
        value: advisory@homes2own.com
      - key: OFFICE_PHONE
        value: "+912261208800"
      - key: RATE_LIMIT_MAX
        value: "200"
