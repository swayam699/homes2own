# =====================================================================
# Render.com Blueprint Deployment Specification
# Deploys both Backend API and compiled React Frontend as a single service
# =====================================================================

services:
  - type: web
    name: cravecart-online-food-system
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_CLIENT
        value: sqlite
