version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. MySQL 8.0 Relational Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: food_ordering_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-food_ordering_db}
      MYSQL_USER: ${DB_USER:-fooduser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food_network

  # -------------------------------------------------------------
  # 2. Node.js + Express.js Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_ordering_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-super_secret_food_ordering_jwt_key_2026_prod}
      JWT_EXPIRES_IN: 7d
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-food_ordering_db}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - food_network

  # -------------------------------------------------------------
  # 3. React.js + Tailwind CSS Frontend (Nginx) Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_ordering_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - food_network

networks:
  food_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
